name: Fix config loading display

on:
  push:
    paths:
      - '.github/workflows/fix-config-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CONFIG loading behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("groom_name:'Mempelai Pria',groom_short:'Pria'", "groom_name:'',groom_short:''", 1)
          s=s.replace("bride_name:'Mempelai Wanita',bride_short:'Wanita'", "bride_name:'',bride_short:''", 1)
          old="async function loadConfig(){try{let controller=new AbortController();let timer=setTimeout(()=>controller.abort(),3000);let r=await fetch(ENDPOINT+'?mode=config&v='+Date.now(),{cache:'no-store',signal:controller.signal});clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();if(j.ok&&j.config)C={...D,...j.config}}catch(e){console.warn('CONFIG gagal/lambat dimuat, memakai fallback.',e)}configReady=true;apply()}"
          new="async function loadConfig(){try{let r=await fetch(ENDPOINT+'?mode=config&v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();if(!j.ok||!j.config)throw new Error('CONFIG tidak tersedia');C={...D,...j.config};configReady=true;apply();return true}catch(e){console.warn('CONFIG belum berhasil dimuat.',e);return false}}"
          if old not in s:
              raise SystemExit('loadConfig target not found')
          s=s.replace(old,new,1)
          old2="$('#open').onclick=()=>{startMusic();$('#cover').classList.add('out');document.body.classList.remove('lock');if(!configReady)loadConfig()};"
          new2="$('#open').onclick=async()=>{startMusic();if(!configReady)await Promise.race([loadConfig(),new Promise(r=>setTimeout(r,1800))]);$('#cover').classList.add('out');document.body.classList.remove('lock')};"
          if old2 not in s:
              raise SystemExit('open handler target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix CONFIG fallback names and loading"
          git push
