<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Test</title><style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#edf4eb;color:#35583c}.box{text-align:center;background:white;padding:28px;border-radius:24px;max-width:340px;box-shadow:0 12px 36px #35583c22}button{border:0;border-radius:999px;background:#35583c;color:white;padding:14px 22px;font-size:16px;font-weight:700}#status{margin-top:16px;font-size:14px;line-height:1.5}</style></head><body><div class="box"><h2>Test Backsound</h2><p>Tekan tombol. Audio diputar langsung dari klik, tanpa request lain.</p><button id="play">▶ Putar Musik</button><div id="status">Siap.</div><audio id="audio" preload="metadata" src="backsound.mp3?v=5"></audio></div><script>const a=document.getElementById('audio'),b=document.getElementById('play'),s=document.getElementById('status');b.addEventListener('click',()=>{s.textContent='Mencoba memutar...';a.volume=.5;const p=a.play();if(p)p.then(()=>{s.textContent='✅ Audio berhasil diputar.';b.textContent='❚❚ Jeda';}).catch(e=>{s.textContent='❌ Gagal: '+e.name+' — '+e.message;});});a.addEventListener('error',()=>{s.textContent='❌ File audio gagal dimuat. MediaError code: '+(a.error?a.error.code:'?');});</script></body></html>
